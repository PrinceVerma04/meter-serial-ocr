<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meter OCR Compare</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1b1f24; --muted: #5d6673; --line: #e2e5ea;
  --accent: #2f6fde; --accent-ink: #ffffff; --soft: #eef3fc;
  --ok: #1f8a4c; --ok-bg: #e5f5ec; --warn: #a76200; --warn-bg: #fdf1df; --bad: #c0362c; --bad-bg: #fbe7e5;
  --diff: #fff3c4; --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111418; --panel: #1a1e24; --ink: #e7eaee; --muted: #9aa3ae; --line: #2c323a;
    --accent: #6c9cf0; --accent-ink: #0d1117; --soft: #1d2735;
    --ok: #5cc98a; --ok-bg: #16301f; --warn: #e3a54a; --warn-bg: #33270f; --bad: #f07a70; --bad-bg: #3a1a17;
    --diff: #4a3f12;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { padding: 16px 24px; background: var(--panel); border-bottom: 1px solid var(--line);
  display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; }
h1 { font-size: 18px; margin: 0; }
h1 small { font-weight: 400; color: var(--muted); font-size: 13px; margin-left: 6px; }
main { max-width: 1500px; margin: 0 auto; padding: 16px 24px 48px; display: grid; gap: 16px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line); border-radius: 999px;
  padding: 4px 10px; cursor: pointer; user-select: none; background: var(--panel); }
.chip input { margin: 0; }
.chip em { font-style: normal; color: var(--muted); font-size: 12px; }
.chip.off { opacity: .45; cursor: not-allowed; }
.drop { border: 2px dashed var(--line); border-radius: 10px; padding: 26px 16px; text-align: center; transition: .15s; }
.drop.over { border-color: var(--accent); background: var(--soft); }
.drop p { margin: 0 0 12px; color: var(--muted); }
.drop strong { color: var(--ink); font-size: 16px; display: block; margin-bottom: 4px; }
button, .btn { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  padding: 7px 14px; border-radius: 8px; cursor: pointer; }
button.primary, .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; }
.progress { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 10px 0 6px; }
.progress div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.status-line { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: 13px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.stat { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.stat b { display: block; font-size: 20px; }
.stat span { color: var(--muted); font-size: 12px; }
.mstats { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px; }
.mstats th, .mstats td { text-align: right; padding: 5px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.mstats th:first-child, .mstats td:first-child { text-align: left; }
.detail { display: grid; grid-template-columns: minmax(240px, 1fr) 2fr; gap: 16px; align-items: start; }
.detail .imgbox { background: repeating-conic-gradient(var(--line) 0 25%, transparent 0 50%) 0 0 / 16px 16px;
  border-radius: 8px; padding: 8px; text-align: center; }
.detail img { max-width: 100%; max-height: 260px; image-rendering: auto; }
.detail .name { font-family: var(--mono); font-size: 12px; color: var(--muted); word-break: break-all; margin-top: 6px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.card .lbl { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
.card .txt { font-family: var(--mono); font-size: 20px; font-weight: 600; margin: 4px 0; word-break: break-all; min-height: 28px; }
.card.diff { background: var(--diff); }
.badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px; font-weight: 600; }
.b-accepted { color: var(--ok); background: var(--ok-bg); }
.b-review { color: var(--warn); background: var(--warn-bg); }
.b-blank, .b-error { color: var(--bad); background: var(--bad-bg); }
.b-agree { color: var(--ok); background: var(--ok-bg); }
.b-disagree { color: var(--bad); background: var(--bad-bg); }
.b-wait { color: var(--muted); background: var(--line); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.toolbar input[type=search] { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--panel); color: var(--ink); min-width: 220px; }
select { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); }
.tablewrap { overflow-x: auto; }
table.res { width: 100%; border-collapse: collapse; font-size: 13px; }
table.res th { position: sticky; top: 0; background: var(--panel); text-align: left; font-weight: 600;
  padding: 8px; border-bottom: 2px solid var(--line); white-space: nowrap; }
table.res td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.res tr { cursor: pointer; }
table.res tr:hover td { background: var(--soft); }
table.res tr.sel td { background: var(--soft); box-shadow: inset 0 0 0 0 var(--accent); }
table.res td.thumb img { height: 34px; max-width: 160px; object-fit: contain; display: block; }
table.res td.file { font-family: var(--mono); font-size: 12px; max-width: 260px; word-break: break-all; color: var(--muted); }
table.res td.m .t { font-family: var(--mono); font-weight: 600; font-size: 14px; }
table.res td.m .c { font-size: 11px; color: var(--muted); }
table.res td.m.diff { background: var(--diff); }
.pager { display: flex; gap: 8px; align-items: center; justify-content: flex-end; margin-top: 10px; color: var(--muted); }
.empty { color: var(--muted); text-align: center; padding: 24px; }
.hidden { display: none !important; }
@media (max-width: 760px) {
  header, main { padding-left: 16px; padding-right: 16px; }
  .detail { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header>
  <h1>Meter OCR — model comparison <small id="gate"></small></h1>
  <div class="chips" id="modelChips"><span class="empty">loading models…</span></div>
</header>

<main>
  <section class="panel">
    <div class="drop" id="drop">
      <strong>Drop an image or a whole folder here</strong>
      <p>Cropped meter-serial images (jpg, png, bmp, tif, webp). Folders include sub-folders. Images stay on this machine.</p>
      <div class="row">
        <label class="btn primary">Choose image(s)<input id="pickFiles" type="file" accept="image/*" multiple hidden></label>
        <label class="btn">Choose folder<input id="pickFolder" type="file" webkitdirectory directory multiple hidden></label>
        <button id="stopBtn" disabled>Stop</button>
        <button id="clearBtn" disabled>Clear results</button>
        <button id="csvBtn" disabled>Download CSV</button>
      </div>
    </div>
    <div id="progWrap" class="hidden">
      <div class="progress"><div id="progBar"></div></div>
      <div class="status-line" id="progText"></div>
    </div>
  </section>

  <section class="panel hidden" id="detailPanel">
    <div class="detail">
      <div>
        <div class="imgbox"><img id="detImg" alt="selected image"></div>
        <div class="name" id="detName"></div>
      </div>
      <div>
        <div class="toolbar" style="margin-bottom:8px">
          <span id="detAgree"></span>
          <span>
            <button id="prevBtn" title="previous image (←)">← Prev</button>
            <button id="nextBtn" title="next image (→)">Next →</button>
          </span>
        </div>
        <div class="cards" id="detCards"></div>
      </div>
    </div>
  </section>

  <section class="panel hidden" id="statsPanel">
    <div class="stats" id="stats"></div>
    <div class="tablewrap"><table class="mstats" id="mstats"></table></div>
  </section>

  <section class="panel hidden" id="tablePanel">
    <div class="toolbar">
      <div class="chips">
        <select id="filter">
          <option value="all">All images</option>
          <option value="disagree">Models disagree</option>
          <option value="agree">All models agree</option>
          <option value="review">Any model below gate / blank</option>
          <option value="error">Errors</option>
        </select>
        <input type="search" id="search" placeholder="Search file name or serial">
      </div>
      <span id="shown" class="empty" style="padding:0"></span>
    </div>
    <div class="tablewrap"><table class="res" id="res"></table></div>
    <div class="pager">
      <button id="pgPrev">‹</button><span id="pgText"></span><button id="pgNext">›</button>
    </div>
  </section>
</main>

<script>
"use strict";
const CONCURRENCY = 6, PAGE = 50;
const IMG_RE = /\.(jpe?g|png|bmp|tiff?|webp)$/i;
const S = { models: [], sel: new Set(), threshold: 0.95, rows: [], queue: [], running: 0, done: 0,
            total: 0, t0: 0, page: 0, filter: "all", q: "", selId: null, nextId: 1 };
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text; return e; };
const label = k => (S.models.find(m => m.key === k) || {}).label || k;

// ---------- models ----------
async function init() {
  try {
    const j = await (await fetch("/api/models")).json();
    S.models = j.models; S.threshold = j.threshold;
    $("gate").textContent = `accept gate ≥ ${S.threshold}`;
    S.models.forEach(m => m.available && S.sel.add(m.key));
    drawChips();
  } catch (e) { $("modelChips").textContent = "Server not reachable — is dashboard/app.py running?"; }
}
function drawChips() {
  const box = $("modelChips"); box.replaceChildren();
  for (const m of S.models) {
    const c = el("label", "chip" + (m.available ? "" : " off"));
    const cb = el("input"); cb.type = "checkbox"; cb.checked = S.sel.has(m.key); cb.disabled = !m.available;
    cb.onchange = () => { cb.checked ? S.sel.add(m.key) : S.sel.delete(m.key); render(); };
    c.append(cb, el("span", "", m.label));
    if (m.note || !m.available) c.append(el("em", "", m.available ? m.note : "file missing"));
    c.title = m.file; box.append(c);
  }
}
const colModels = () => S.models.filter(m => S.sel.has(m.key) ||
  S.rows.some(r => r.reads && r.reads[m.key])).filter(m => m.available).map(m => m.key);

// ---------- adding files ----------
function addFiles(list) {
  const imgs = list.filter(x => IMG_RE.test(x.file.name));
  if (!imgs.length) { alert("No images found (jpg, png, bmp, tif, webp)."); return; }
  if (!S.sel.size) { alert("Select at least one model."); return; }
  imgs.sort((a, b) => a.path.localeCompare(b.path, undefined, { numeric: true }));
  if (S.running === 0 && S.queue.length === 0) { S.t0 = performance.now(); S.done = 0; S.total = 0; }
  const models = [...S.sel];
  for (const x of imgs) {
    const row = { id: S.nextId++, path: x.path, file: x.file, models, reads: null, error: null, state: "queued" };
    S.rows.push(row); S.queue.push(row);
  }
  S.total += imgs.length;
  if (S.selId === null) S.selId = S.rows[S.rows.length - imgs.length].id;
  pump(); render();
}
function pump() {
  while (S.running < CONCURRENCY && S.queue.length) {
    const row = S.queue.shift(); S.running++;
    readOne(row).finally(() => { S.running--; S.done++; schedule(); pump(); });
  }
}
async function readOne(row) {
  row.state = "running";
  try {
    const r = await fetch("/api/read?models=" + encodeURIComponent(row.models.join(",")),
      { method: "POST", body: row.file, headers: { "Content-Type": "application/octet-stream" } });
    const j = await r.json();
    if (j.error) { row.error = j.error; row.state = "error"; }
    else { row.reads = j.reads; row.w = j.w; row.h = j.h; row.state = "done"; agreeOf(row); }
  } catch (e) { row.error = "request failed: " + e.message; row.state = "error"; }
}
function agreeOf(row) {
  const texts = Object.values(row.reads).map(v => v.text);
  const counts = {}; texts.forEach(t => counts[t] = (counts[t] || 0) + 1);
  row.majority = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
  row.distinct = Object.keys(counts).length;
  row.agree = row.distinct === 1 && texts[0] !== "";
  row.anyReview = Object.values(row.reads).some(v => v.status !== "accepted");
}

// file pickers + drag/drop (folders walked recursively)
$("pickFiles").onchange = e => { addFiles([...e.target.files].map(f => ({ file: f, path: f.name }))); e.target.value = ""; };
$("pickFolder").onchange = e => { addFiles([...e.target.files].map(f => ({ file: f, path: f.webkitRelativePath || f.name }))); e.target.value = ""; };
const drop = $("drop");
["dragenter", "dragover"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", async e => {
  const entries = [...e.dataTransfer.items].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  const out = [];
  if (!entries.length) { [...e.dataTransfer.files].forEach(f => out.push({ file: f, path: f.name })); }
  else { await Promise.all(entries.map(en => walk(en, out))); }
  addFiles(out);
});
function walk(entry, out) {
  if (entry.isFile) return new Promise(res => entry.file(f => { out.push({ file: f, path: entry.fullPath.replace(/^\//, "") }); res(); }, res));
  if (!entry.isDirectory) return Promise.resolve();
  const reader = entry.createReader();
  return new Promise(res => {
    const batch = [];
    const next = () => reader.readEntries(async ents => {
      if (!ents.length) { await Promise.all(batch.map(x => walk(x, out))); res(); }
      else { batch.push(...ents); next(); }
    }, () => res());
    next();
  });
}

// ---------- buttons ----------
$("stopBtn").onclick = () => {
  const stopped = new Set(S.queue.map(r => r.id));
  S.total -= S.queue.length; S.queue = [];
  S.rows = S.rows.filter(r => !stopped.has(r.id)); render();
};
$("clearBtn").onclick = () => {
  if (S.running) return;
  S.rows.forEach(r => r.url && URL.revokeObjectURL(r.url));
  Object.assign(S, { rows: [], queue: [], done: 0, total: 0, page: 0, selId: null }); render();
};
$("csvBtn").onclick = () => {
  const keys = colModels();
  const cell = v => { let s = String(v ?? ""); if (/^[=+\-@]/.test(s)) s = "'" + s;
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const head = ["file", ...keys.flatMap(k => [k + "_text", k + "_conf", k + "_status"]), "all_agree", "error"];
  const lines = [head.join(",")];
  for (const r of S.rows.filter(r => r.state === "done" || r.state === "error")) {
    lines.push([r.path, ...keys.flatMap(k => { const v = r.reads && r.reads[k];
      return v ? [v.text, v.conf, v.status] : ["", "", ""]; }), r.reads ? (r.agree ? "yes" : "no") : "", r.error || ""].map(cell).join(","));
  }
  const a = el("a"); a.href = URL.createObjectURL(new Blob(["﻿" + lines.join("\n")], { type: "text/csv" }));
  a.download = "meter_ocr_reads_" + new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-") + ".csv"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};
$("filter").onchange = e => { S.filter = e.target.value; S.page = 0; render(); };
$("search").oninput = e => { S.q = e.target.value.trim().toLowerCase(); S.page = 0; render(); };
$("pgPrev").onclick = () => { S.page--; render(); };
$("pgNext").onclick = () => { S.page++; render(); };
$("prevBtn").onclick = () => step(-1);
$("nextBtn").onclick = () => step(1);
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  if (e.key === "ArrowLeft") step(-1); if (e.key === "ArrowRight") step(1);
});
function step(d) {
  const list = filtered(); const i = list.findIndex(r => r.id === S.selId);
  const n = list[Math.min(list.length - 1, Math.max(0, i + d))]; if (!n) return;
  S.selId = n.id; S.page = Math.floor(list.indexOf(n) / PAGE); render();
}

// ---------- rendering ----------
let pending = false;
function schedule() { if (!pending) { pending = true; requestAnimationFrame(() => { pending = false; render(); }); } }
function filtered() {
  return S.rows.filter(r => {
    if (S.filter === "disagree" && !(r.reads && r.distinct > 1)) return false;
    if (S.filter === "agree" && !(r.reads && r.agree)) return false;
    if (S.filter === "review" && !(r.reads && r.anyReview)) return false;
    if (S.filter === "error" && r.state !== "error") return false;
    if (S.q) {
      const hay = (r.path + " " + (r.reads ? Object.values(r.reads).map(v => v.text).join(" ") : "")).toLowerCase();
      if (!hay.includes(S.q)) return false;
    }
    return true;
  });
}
const urlOf = r => r.url || (r.url = URL.createObjectURL(r.file));
function badge(cls, text) { return el("span", "badge b-" + cls, text); }

function render() {
  const has = S.rows.length > 0, busy = S.running > 0 || S.queue.length > 0;
  ["detailPanel", "statsPanel", "tablePanel"].forEach(id => $(id).classList.toggle("hidden", !has));
  $("progWrap").classList.toggle("hidden", !has);
  $("stopBtn").disabled = !S.queue.length; $("clearBtn").disabled = !has || busy;
  $("csvBtn").disabled = !S.rows.some(r => r.state === "done");
  if (!has) return;

  // progress
  const sec = (performance.now() - S.t0) / 1000, rate = S.done / Math.max(sec, 0.001);
  $("progBar").style.width = (S.total ? 100 * S.done / S.total : 0) + "%";
  const left = S.total - S.done;
  $("progText").replaceChildren(...[
    `${S.done.toLocaleString()} / ${S.total.toLocaleString()} images`,
    busy ? `${rate.toFixed(1)} img/s` : `finished in ${sec.toFixed(1)} s`,
    busy && rate > 0 ? `about ${Math.ceil(left / rate)} s left` : "",
  ].filter(Boolean).map(t => el("span", "", t)));

  const keys = colModels();
  const done = S.rows.filter(r => r.reads);

  // summary
  const agree = done.filter(r => r.agree).length, dis = done.filter(r => r.distinct > 1).length;
  const errs = S.rows.filter(r => r.state === "error").length;
  $("stats").replaceChildren(...[
    [done.length.toLocaleString(), "images read"],
    [agree.toLocaleString(), `all models agree (${pct(agree, done.length)})`],
    [dis.toLocaleString(), `models disagree (${pct(dis, done.length)})`],
    [errs.toLocaleString(), "errors (not an image, too big…)"],
  ].map(([b, s]) => { const d = el("div", "stat"); d.append(el("b", "", b), el("span", "", s)); return d; }));
  const mt = $("mstats"); mt.replaceChildren();
  const hr = el("tr"); ["model", "images", "accepted ≥ gate", "below gate", "blank", "same as majority", "avg ms / image"]
    .forEach(h => hr.append(el("th", "", h))); mt.append(hr);
  for (const k of keys) {
    const rs = done.filter(r => r.reads[k]); const v = rs.map(r => r.reads[k]);
    const tr = el("tr");
    [label(k), rs.length, cnt(v, "accepted"), cnt(v, "review"), cnt(v, "blank"),
     pct(rs.filter(r => r.reads[k].text === r.majority).length, rs.length),
     rs.length ? (v.reduce((a, x) => a + x.ms, 0) / rs.length).toFixed(0) : "—"]
      .forEach(x => tr.append(el("td", "", String(x))));
    mt.append(tr);
  }

  // table
  const list = filtered(); const pages = Math.max(1, Math.ceil(list.length / PAGE));
  S.page = Math.min(Math.max(0, S.page), pages - 1);
  $("shown").textContent = `${list.length.toLocaleString()} of ${S.rows.length.toLocaleString()} shown`;
  const t = $("res"); t.replaceChildren();
  const h = el("tr"); ["", "image", ...keys.map(label), "agreement"].forEach(x => h.append(el("th", "", x))); t.append(h);
  for (const r of list.slice(S.page * PAGE, (S.page + 1) * PAGE)) {
    const tr = el("tr", r.id === S.selId ? "sel" : "");
    tr.onclick = () => { S.selId = r.id; render(); window.scrollTo({ top: 0, behavior: "smooth" }); };
    const th = el("td", "thumb"); const im = el("img"); im.loading = "lazy"; im.src = urlOf(r); im.alt = ""; th.append(im); tr.append(th);
    tr.append(el("td", "file", r.path));
    for (const k of keys) {
      const v = r.reads && r.reads[k]; const td = el("td", "m");
      if (v) {
        if (r.distinct > 1 && v.text !== r.majority) td.classList.add("diff");
        td.append(el("div", "t", v.text || "∅"));
        const c = el("div", "c"); c.append(String(v.conf.toFixed(3)) + " ", badge(v.status, v.status)); td.append(c);
      } else td.append(el("span", "c", r.state === "error" ? "" : r.reads ? "not run" : "…"));
      tr.append(td);
    }
    const ag = el("td");
    ag.append(r.state === "error" ? badge("error", r.error) : !r.reads ? badge("wait", r.state)
      : r.agree ? badge("agree", "all agree") : badge("disagree", `${r.distinct} different reads`));
    tr.append(ag); t.append(tr);
  }
  if (!list.length) { const tr = el("tr"); const td = el("td", "empty", "No images match this filter."); td.colSpan = keys.length + 3; tr.append(td); t.append(tr); }
  $("pgText").textContent = `page ${S.page + 1} / ${pages}`;
  $("pgPrev").disabled = S.page === 0; $("pgNext").disabled = S.page >= pages - 1;

  // detail of the selected image
  const r = S.rows.find(x => x.id === S.selId) || S.rows[0]; S.selId = r.id;
  if ($("detImg").dataset.id !== String(r.id)) { $("detImg").src = urlOf(r); $("detImg").dataset.id = r.id; }
  $("detName").textContent = r.path + (r.w ? `  ·  ${r.w}×${r.h}px` : "");
  $("detAgree").replaceChildren(r.state === "error" ? badge("error", r.error) : !r.reads ? badge("wait", r.state)
    : r.agree ? badge("agree", `all ${Object.keys(r.reads).length} models agree`) : badge("disagree", `${r.distinct} different reads — majority: ${r.majority || "∅"}`));
  const cards = $("detCards"); cards.replaceChildren();
  for (const k of keys) {
    const v = r.reads && r.reads[k]; const c = el("div", "card");
    const top = el("div", "lbl"); top.append(el("span", "", label(k)));
    const m = S.models.find(x => x.key === k); if (m && m.note) top.append(el("span", "", m.note));
    c.append(top);
    if (v) {
      if (r.distinct > 1 && v.text !== r.majority) c.classList.add("diff");
      c.append(el("div", "txt", v.text || "∅"));
      const f = el("div", "lbl"); const l = el("span"); l.append(`conf ${v.conf.toFixed(4)} `, badge(v.status, v.status));
      f.append(l, el("span", "", `${v.ms} ms`)); c.append(f);
    } else c.append(el("div", "txt", r.state === "error" ? "—" : r.reads ? "not run" : "…"));
    cards.append(c);
  }
}
const cnt = (v, s) => v.filter(x => x.status === s).length;
const pct = (a, b) => b ? (100 * a / b).toFixed(1) + "%" : "—";
setInterval(() => { if (S.running) render(); }, 1000);
init();
</script>
